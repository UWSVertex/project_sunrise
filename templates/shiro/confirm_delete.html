{% extends 'shiro/base.html' %}

{% block title %}Delete {{ type }} - Companion App{% endblock %}

{% block content %}
<div class="page-header">
    <h1>Delete {{ type }}</h1>
</div>

<div class="row">
    <div class="col-md-6 offset-md-3">
        <div class="card border-danger">
            <div class="card-header bg-danger text-white">
                <h5 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Confirm Delete</h5>
            </div>
            <div class="card-body">
                <p class="mb-3">Are you sure you want to delete this {{ type|lower }}?</p>
                <div class="alert alert-warning mb-3">
                    <strong>{{ object }}</strong>
                </div>
                <p class="text-muted mb-4">This action cannot be undone.</p>
                
                <form method="post" class="d-flex gap-2">
                    {% csrf_token %}
                    <button type="submit" class="btn btn-danger btn-lg flex-grow-1">
                        <i class="fas fa-trash"></i> Yes, Delete
                    </button>
                    <a href="javascript:history.back()" class="btn btn-secondary btn-lg flex-grow-1">
                        <i class="fas fa-times"></i> Cancel
                    </a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
